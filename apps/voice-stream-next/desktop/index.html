<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceStream Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-compact">
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark"></span>
          <div>
            <p class="eyebrow">Voice Stream</p>
            <h1>Desktop voice</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="status-block">
            <span id="connectionDot" class="dot"></span>
            <div>
              <strong id="connectionLabel">Disconnected</strong>
              <span id="deviceLabel">No device connected</span>
            </div>
          </div>
          <button id="signInButton" class="secondary" type="button">Sign in</button>
          <button id="openWebButton" class="secondary" type="button">Open hub</button>
          <button id="compactButton" class="secondary window-button" type="button" aria-label="Minimize to voice controls">Minimize</button>
          <button id="closeButton" class="secondary window-button" type="button" aria-label="Close VoiceStream">x</button>
        </div>
      </header>

      <section class="voice-stage" aria-labelledby="voice-title">
        <button id="expandButton" class="expand-button" type="button" aria-label="Expand VoiceStream">Full</button>

        <div class="voice-copy">
          <p class="eyebrow">Assistant microphone</p>
          <h2 id="voice-title">Voice control</h2>
          <p id="authStatus" class="auth-status muted">Checking session.</p>
        </div>

        <button id="primaryVoiceButton" class="voice-orb is-off" type="button" aria-label="Start desktop voice">
          <span class="orb-ring"></span>
          <span class="mic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </span>
          <strong id="primaryVoiceMode">Off</strong>
          <span id="primaryVoiceAction">Start voice</span>
        </button>

        <button id="offButton" class="off-button" type="button">Off</button>

        <div class="meter-shell" aria-hidden="true">
          <div id="meterBar" class="meter-bar"></div>
        </div>

        <p id="micStatus" class="voice-status">Connect this desktop, then start voice.</p>
      </section>

      <footer class="connection-strip">
        <label>
          Server
          <input id="serverUrlInput" autocomplete="off" />
        </label>
        <label>
          Desktop name
          <input id="deviceNameInput" autocomplete="off" />
        </label>
        <button id="saveButton" type="button">Save</button>
        <button id="pairButton" class="secondary" type="button">Connect desktop</button>
        <p id="pairingMessage" class="strip-message muted">Use Sign in for Clerk, or connect to a local development server.</p>
      </footer>
    </main>
    <script src="../shared/approval-code.js"></script>
    <script src="../shared/pcm-capture-buffer.js"></script>
    <script src="../shared/local-voice-cues.js"></script>
    <script src="../shared/pairing-payload-parser.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
