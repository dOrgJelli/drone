<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceStream Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-signed-out">
    <section class="auth-screen" aria-labelledby="auth-title">
      <button id="authCloseButton" class="secondary window-button auth-close" type="button" aria-label="Close VoiceStream">x</button>
      <div class="auth-panel">
        <div class="brand-lockup auth-brand">
          <span class="brand-mark"></span>
          <div>
            <p class="eyebrow">Voice Stream</p>
            <h1 id="auth-title">Sign in to Voice Stream</h1>
          </div>
        </div>
        <p id="authStatus" class="auth-status muted">Sign in with your browser to connect this desktop.</p>
        <div class="auth-actions">
          <button id="signInButton" type="button">Sign in</button>
          <button id="openWebButton" class="secondary" type="button">Open web</button>
        </div>
      </div>
    </section>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark"></span>
          <div>
            <h1>Voice Stream</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="status-account-block">
            <span id="connectionDot" class="dot"></span>
            <div>
              <strong id="connectionLabel">Disconnected</strong>
              <span id="deviceLabel">No device connected</span>
              <span class="sr-only" id="accountLabel">Connected</span>
              <span class="sr-only" id="accountDetail">Desktop voice</span>
            </div>
            <button id="signOutButton" class="secondary" type="button">Log out</button>
          </div>
          <div class="settings-popover">
            <button id="settingsButton" class="secondary window-button icon-button" type="button" aria-label="Audio settings" aria-expanded="false">Audio</button>
            <div id="settingsPanel" class="settings-panel" hidden>
              <div class="voice-device-panel" aria-label="Audio devices">
                <div class="device-picker">
                  <span class="device-picker-title">Input</span>
                  <button id="inputDeviceButton" class="device-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="inputDeviceLabel">System default</span>
                    <span class="device-picker-chevron" aria-hidden="true"></span>
                  </button>
                  <div id="inputDeviceMenu" class="device-picker-menu" role="listbox" hidden></div>
                  <select id="inputDeviceSelect" class="device-select-hidden" tabindex="-1" aria-hidden="true"></select>
                </div>
                <div class="device-picker">
                  <span class="device-picker-title">Output</span>
                  <button id="outputDeviceButton" class="device-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="outputDeviceLabel">System default</span>
                    <span class="device-picker-chevron" aria-hidden="true"></span>
                  </button>
                  <div id="outputDeviceMenu" class="device-picker-menu" role="listbox" hidden></div>
                  <select id="outputDeviceSelect" class="device-select-hidden" tabindex="-1" aria-hidden="true"></select>
                </div>
              </div>
            </div>
          </div>
          <button id="compactButton" class="secondary window-button" type="button" aria-label="Minimize to voice controls">Minimize</button>
          <button id="closeButton" class="secondary window-button" type="button" aria-label="Close VoiceStream">x</button>
        </div>
      </header>

      <section class="voice-stage" aria-label="Voice controls">
        <button id="expandButton" class="expand-button" type="button" aria-label="Expand VoiceStream">Open</button>

        <div class="voice-copy">
          <p id="voiceAuthStatus" class="auth-status muted">Checking session.</p>
        </div>

        <button id="primaryVoiceButton" class="voice-orb is-off" type="button" aria-label="Start desktop voice">
          <span class="orb-ring"></span>
          <span class="mic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </span>
          <strong id="primaryVoiceMode">Off</strong>
          <span id="primaryVoiceAction">Start voice</span>
        </button>

        <button id="offButton" class="off-button" type="button">Off</button>

        <div class="meter-shell" aria-hidden="true">
          <div id="meterBar" class="meter-bar"></div>
        </div>

        <p id="micStatus" class="voice-status">Connect this desktop, then start voice.</p>
      </section>

    </main>
    <script src="../shared/approval-code.js"></script>
    <script src="../shared/pcm-capture-buffer.js"></script>
    <script src="../shared/local-voice-cues.js"></script>
    <script src="../shared/pairing-payload-parser.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
